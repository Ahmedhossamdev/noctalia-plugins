# Plugin source catalog for https://github.com/Ahmedhossamdev/noctalia-plugins
# Each [[plugin]] entry's `id` suffix (after the "author/") must match its
# top-level directory name.

[[plugin]]
id          = "ahmedhossamdev/timezone-hub"
name        = "Timezone Hub"
version     = "2.0.0"
plugin_api  = 24
author      = "ahmedhossamdev"
license     = "MIT"
icon        = "world"
description = "Change your device timezone and compare it against other cities, with live times and an hour-offset strip for each."
tags        = ["clock", "time", "timezone", "utility"]

[[plugin]]
id          = "ahmedhossamdev/sticky-notes"
name        = "Sticky Notes"
version     = "1.1.0"
plugin_api  = 24
author      = "ahmedhossamdev"
license     = "MIT"
icon        = "note"
description = "Colorful sticky notes and interactive checklists from your bar, with pinning, privacy blur, and portable storage."
tags        = ["bar", "panel", "service", "privacy", "productivity", "utility"]

[[plugin]]
id          = "ahmedhossamdev/display-arrange"
name        = "Display Arrange"
version     = "1.1.0"
plugin_api  = 24
author      = "ahmedhossamdev"
license     = "MIT"
icon        = "device-desktop"
description = "Arrange connected displays relative to each other - left, right, above, below - with rotation, and keep the layout applied."
tags        = ["display", "monitor", "niri", "system", "utility"]

[[plugin]]
id          = "ahmedhossamdev/reading-list"
name        = "Reading List"
version     = "2.0.0"
plugin_api  = 26
author      = "ahmedhossamdev"
license     = "MIT"
icon        = "bookmarks"
description = "Save articles, books, and images locally with collections, reading progress, sharing, and Obsidian-friendly notes."
tags        = ["bar", "panel", "service", "productivity", "utility"]

[[plugin]]
id          = "ahmedhossamdev/github-feed"
name        = "GitHub Feed"
version     = "1.0.0"
plugin_api  = 26
author      = "ahmedhossamdev"
license     = "MIT"
icon        = "brand-github"
description = "See your GitHub feed on your desktop - pushes, pull requests, issues, releases, and stars from people you follow."
tags        = ["github", "feed", "developer", "utility"]
