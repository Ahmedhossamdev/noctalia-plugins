# GitHub Feed — your GitHub homepage feed on your desktop.
#
# Shows the same activity you see on github.com (pushes, pull requests,
# issues, releases, stars, forks…) for people you follow plus any extra
# users you watch, from the bar and a panel.

id          = "ahmedhossamdev/github-feed"
name        = "GitHub Feed"
version     = "1.1.0"
plugin_api  = 26
author      = "ahmedhossamdev"
license     = "MIT"
icon        = "brand-github"
description = "Your GitHub homepage feed on your desktop - pushes, pull requests, issues, releases, and stars, signed in via gh."
tags        = ["github", "feed", "developer", "utility"]
dependencies = ["xdg-open", "gh"]

[[widget]]
id    = "bar"
entry = "bar.luau"

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 560
height          = 620
placement       = "attached"
position        = "auto"
open_near_click = true

[[service]]
id    = "service"
entry = "service.luau"

[[setting]]
key             = "github_username"
type            = "string"
label_key       = "settings.github-username"
description_key = "settings.github-username-desc"
default         = ""

[[setting]]
key             = "github_token"
type            = "string"
label_key       = "settings.github-token"
description_key = "settings.github-token-desc"
default         = ""

[[setting]]
key         = "refresh_interval"
type        = "int"
label_key   = "settings.refresh-interval"
default     = 30
min         = 5
max         = 240

[[setting]]
key         = "max_items"
type        = "int"
label_key   = "settings.max-items"
default     = 30
min         = 10
max         = 100

[[setting]]
key             = "show_count_in_bar"
type            = "bool"
label_key       = "settings.show-count-in-bar"
description_key = "settings.show-count-in-bar-desc"
default         = true
